# ============================================================
# SECRETS.YAML - Kubernetes Secrets from AWS Secrets Manager
# These secrets are created by Terraform and referenced by values.yaml
# This template ensures secrets exist in the namespace
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: {{ .Values.global.namespaceOverride | default "retail-app" }}
  annotations:
    # Mark as managed by external system (Terraform)
    "managed-by": "terraform-aws-secrets-manager"
type: Opaque
stringData:
  # These will be populated by Terraform after RDS creation
  # Terraform creates the actual secret; this is a placeholder template
  # In production, use External Secrets Operator to sync from AWS SM
  host: "REPLACE_WITH_CATALOG_RDS_ENDPOINT"
  port: "3306"
  username: "admin"
  password: "REPLACE_WITH_PASSWORD"
  dbname: "catalogdb"
  jdbc_url: "jdbc:mysql://REPLACE_WITH_CATALOG_RDS_ENDPOINT:3306/catalogdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-db-credentials
  namespace: {{ .Values.global.namespaceOverride | default "retail-app" }}
  annotations:
    "managed-by": "terraform-aws-secrets-manager"
type: Opaque
stringData:
  host: "REPLACE_WITH_ORDERS_RDS_ENDPOINT"
  port: "5432"
  username: "admin"
  password: "REPLACE_WITH_PASSWORD"
  dbname: "ordersdb"
  jdbc_url: "jdbc:postgresql://REPLACE_WITH_ORDERS_RDS_ENDPOINT:5432/ordersdb"
