global:
  namespaceOverride: retail-app

ui:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/success-codes: "200"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

catalog:
  enabled: true
  replicaCount: 2
  mysql:
    enabled: false
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: catalog-db-credentials
          key: host
    - name: DB_PORT
      value: "3306"
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: catalog-db-credentials
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: catalog-db-credentials
          key: password
    - name: DB_NAME
      valueFrom:
        secretKeyRef:
          name: catalog-db-credentials
          key: dbname
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

carts:
  enabled: true
  replicaCount: 2
  dynamodb:
    enabled: false
  serviceAccount:
    create: true
    name: carts
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::YOUR_ACCOUNT_ID:role/bedrock-carts-dynamodb-role"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    - name: CARTS_DYNAMODB_TABLE
      value: bedrock-carts
    - name: AWS_REGION
      value: us-east-1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

orders:
  enabled: true
  replicaCount: 2
  mysql:
    enabled: false
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    - name: SPRING_DATASOURCE_WRITER_URL
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: jdbc_url
    - name: SPRING_DATASOURCE_WRITER_USERNAME
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: username
    - name: SPRING_DATASOURCE_WRITER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: password
    - name: SPRING_DATASOURCE_READER_URL
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: jdbc_url
    - name: SPRING_DATASOURCE_READER_USERNAME
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: username
    - name: SPRING_DATASOURCE_READER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: orders-db-credentials
          key: password
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

checkout:
  enabled: true
  replicaCount: 2
  redis:
    enabled: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

assets:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
