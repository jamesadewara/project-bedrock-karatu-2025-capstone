apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: retail-app
  labels:
    app: orders
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        version: v1
    spec:
      serviceAccountName: default
      containers:
      - name: orders
        image: public.ecr.aws/aws-containers/retail-store-sample-orders:1.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
          value: postgresql
        - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: retail-app-config
              key: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
        - name: RETAIL_ORDERS_PERSISTENCE_USER
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: username
        - name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: password
        - name: RETAIL_ORDERS_MESSAGING_PROVIDER
          value: rabbitmq
        - name: RETAIL_ORDERS_MESSAGING_ENDPOINT
          value: rabbitmq:5672
        - name: RETAIL_ORDERS_MESSAGING_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RETAIL_ORDERS_MESSAGING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 3
