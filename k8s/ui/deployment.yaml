apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail-app
  labels:
    app: ui
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        version: v1
    spec:
      serviceAccountName: default
      containers:
      - name: ui
        image: public.ecr.aws/aws-containers/retail-store-sample-ui:1.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
          value: /actuator
        - name: AWS_REGION
          value: "us-east-1"
        - name: CATALOG_API_URL
          value: http://catalog.retail-app.svc.cluster.local
        - name: ORDERS_API_URL
          value: http://orders.retail-app.svc.cluster.local
        - name: CART_API_URL
          value: http://carts.retail-app.svc.cluster.local
        - name: CHECKOUT_API_URL
          value: http://checkout.retail-app.svc.cluster.local
        - name: ASSETS_API_URL
          value: http://assets.retail-app.svc.cluster.local
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
