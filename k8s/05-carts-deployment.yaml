apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: retail-app
  labels:
    app: carts
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carts
  template:
    metadata:
      labels:
        app: carts
        version: v1
    spec:
      serviceAccountName: carts
      containers:
      - name: carts
        image: public.ecr.aws/aws-containers/retail-store-sample-carts:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: CARTS_DYNAMODB_TABLE
          value: bedrock-carts
        - name: AWS_REGION
          value: us-east-1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5