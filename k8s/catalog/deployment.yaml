apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-app
  labels:
    app: catalog
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        version: v1
    spec:
      serviceAccountName: default
      containers:
      - name: catalog
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
          value: mysql
        - name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
          value: catalog-db:3306
        - name: RETAIL_CATALOG_PERSISTENCE_USER
          valueFrom:
            secretKeyRef:
              name: catalog-db-credentials
              key: username
        - name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalog-db-credentials
              key: password
        - name: RETAIL_CATALOG_PERSISTENCE_DB_NAME
          valueFrom:
            secretKeyRef:
              name: catalog-db-credentials
              key: dbname
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
