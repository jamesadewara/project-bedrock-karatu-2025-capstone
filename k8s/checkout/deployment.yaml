apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: retail-app
  labels:
    app: checkout
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        version: v1
    spec:
      serviceAccountName: default
      containers:
      - name: checkout
        image: public.ecr.aws/aws-containers/retail-store-sample-checkout:1.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
          value: redis
        - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: retail-app-config
              key: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
        - name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
          valueFrom:
            configMapKeyRef:
              name: retail-app-config
              key: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
