apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: retail-app
  labels:
    app: carts
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carts
  template:
    metadata:
      labels:
        app: carts
        version: v1
    spec:
      serviceAccountName: carts
      containers:
      - name: carts
        image: public.ecr.aws/aws-containers/retail-store-sample-cart:1.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: RETAIL_CART_PERSISTENCE_PROVIDER
          value: dynamodb
        - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
          valueFrom:
            configMapKeyRef:
              name: retail-app-config
              key: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: retail-app-config
              key: AWS_REGION
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 45   
          periodSeconds: 10