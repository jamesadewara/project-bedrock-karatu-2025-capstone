# ============================================================
# GITHUB ACTIONS - Terraform Plan on Pull Request
# Posts plan output as PR comment for review
# Uses OIDC for AWS authentication (no hardcoded credentials)
# ============================================================
name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write       # Required for OIDC
  contents: read          # Required to checkout code
  pull-requests: write    # Required to post PR comments

env:
  TF_IN_AUTOMATION: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}


jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Terraform-Plan

      # Step 3: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      # Step 4: Terraform Format Check
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Step 5: Terraform Init
      - name: Terraform Init
        id: init
        run: terraform init

      # Step 6: Terraform Validate
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Step 7: Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      # Step 8: Post Plan to PR Comment
      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const plan = '${{ steps.plan.outputs.stdout }}' || "No plan output";
            const planErr = '${{ steps.plan.outputs.stderr }}' || "";

            const output = `## Terraform Plan Results\n\n### Status Summary
            - **Format Check**: ${{ steps.fmt.outcome }} 🖌️
            - **Initialization**: ${{ steps.init.outcome }} ⚙️
            - **Validation**: ${{ steps.validate.outcome }} 🤖
            - **Plan**: ${{ steps.plan.outcome }} 📖\n\n<details><summary>Show Plan Output</summary>\n\n\`\`\`terraform\n${plan}\n${planErr}\n\`\`\`\n\n</details>\n\n*Triggered by: @${{ github.actor }} | Event: ${{ github.event_name }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Step 9: Fail if plan failed
      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
