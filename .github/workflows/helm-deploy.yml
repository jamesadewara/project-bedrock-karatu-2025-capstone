# ============================================================
# GITHUB ACTIONS - Deploy Retail App via Helm
# Triggered on changes to helm/ directory
# ============================================================
name: Deploy Retail App

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: project-bedrock-cluster
  NAMESPACE: retail-app

jobs:
  deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Login to ECR Public
        run: |
          helm registry login public.ecr.aws --username AWS --password $(aws ecr-public get-login-password --region us-east-1)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ./terraform
        run: |
          terraform init
          echo "ACM_ARN=$(terraform output -raw acm_certificate_arn)" >> $GITHUB_ENV
          echo "DOMAIN_NAME=$(terraform output -raw domain_name)" >> $GITHUB_ENV
          echo "CARTS_ROLE_ARN=$(terraform output -raw carts_dynamodb_role_arn)" >> $GITHUB_ENV

      - name: Update Helm Dependencies
        working-directory: ./helm
        run: helm dependency update

      - name: Deploy with Helm
        working-directory: ./helm
        run: |
          helm upgrade --install retail-app . \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values values.yaml \
            --set ui.ingress.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"="${{ env.ACM_ARN }}" \
            --set ui.ingress.hosts[0].host="${{ env.DOMAIN_NAME }}" \
            --set carts.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${{ env.CARTS_ROLE_ARN }}" \
            --wait \
            --timeout 10m

      - name: Verify Deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}
