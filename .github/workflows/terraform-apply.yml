# ============================================================
# GITHUB ACTIONS - Terraform Apply on Merge to Main
# Automatically applies infrastructure changes after PR merge
# Uses OIDC for AWS authentication
# ============================================================
name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

permissions:
  id-token: write       # Required for OIDC
  contents: read          # Required to checkout code

env:
  TF_IN_AUTOMATION: true
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Terraform-Apply

      # Step 3: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # Step 4: Terraform Init
      - name: Terraform Init
        run: terraform init

      # Step 5: Terraform Apply
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false

      # Step 6: Generate grading.json
      - name: Generate Grading JSON
        run: terraform output -json > ../grading.json

      # Step 7: Commit grading.json back to repo
      - name: Commit Grading JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update grading.json from Terraform apply"
          file_pattern: grading.json

      # Step 8: Notify on Failure
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform Apply Failed',
              body: 'Terraform apply failed on main branch. Check [Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
