# ============================================================
# GITHUB ACTIONS - Terraform Apply on Merge to Main
# Automatically applies infrastructure changes after PR merge
# Uses OIDC for AWS authentication
# ============================================================
name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

permissions:
  id-token: write       # Required for OIDC
  contents: write       # Required to commit grading.json
  issues: writ         # Required to create failure issues

env:
  TF_IN_AUTOMATION: true
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Terraform-Apply

      # Step 3: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # Step 4: Terraform Init
      - name: Terraform Init
        run: terraform init

      # Step 5: Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Step 5: Terraform Apply
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false

      # Step 6: Generate grading.json
      - name: Generate Grading JSON
        run: terraform output -json > ../grading.json

      # Step 7: Configure Git for auto-commit
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Step 8: Commit grading.json back to repo
      - name: Commit Grading JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update grading.json from Terraform apply [skip ci]"
          file_pattern: grading.json
          create_branch: false

      # Step 9: Notify on Failure
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[ALERT] Terraform Apply Failed on Main Branch',
              body: `Terraform apply failed on main branch.\n\nRun Details:\n- Workflow: ${{ github.workflow }}\n- Commit: ${{ github.sha }}\n- Triggered by: ${{ github.actor }}\n- [View Run Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nPlease investigate and fix the infrastructure code.`,
              labels: ['terraform', 'bug']
            });
